bundle:
  name: nyc-taxi-compute-experiments

artifacts:
  pipeline:
    type: whl
    path: ..
    build: .venv/bin/python -m build --wheel
    dynamic_version: true

resources:
  jobs:
    serverless:
      name: nyc-taxi-dev-compute-serverless-experiment
      max_concurrent_runs: 1
      timeout_seconds: 3600
      performance_target: STANDARD
      queue:
        enabled: false
      tags:
        project: nyc-taxi-lakehouse
        purpose: classic-vs-serverless
      parameters:
        - name: phase
          default: measure
        - name: experiment_id
          default: unset
        - name: sample_id
          default: unset
      environments:
        - environment_key: compute
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: replay
          environment_key: compute
          max_retries: 0
          python_wheel_task:
            package_name: nyc_taxi_lakehouse
            entry_point: nyc-taxi-compute-experiment
            named_parameters:
              phase: "{{job.parameters.phase}}"
              experiment_id: "{{job.parameters.experiment_id}}"
              sample_id: "{{job.parameters.sample_id}}"
              compute_type: SERVERLESS
              job_run_id: "{{job.run_id}}"
    classic:
      name: nyc-taxi-dev-compute-classic-experiment
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: false
      tags:
        project: nyc-taxi-lakehouse
        purpose: classic-vs-serverless
      parameters:
        - name: phase
          default: measure
        - name: experiment_id
          default: unset
        - name: sample_id
          default: unset
      job_clusters:
        - job_cluster_key: fixed_classic
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4s_v3
            driver_node_type_id: Standard_D4s_v3
            num_workers: 1
            runtime_engine: PHOTON
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            policy_id: 0009B403C3ACF0D9
            apply_policy_default_values: true
            azure_attributes:
              availability: ON_DEMAND_AZURE
              first_on_demand: 2
            custom_tags:
              project: nyc-taxi-lakehouse
              purpose: classic-vs-serverless
      tasks:
        - task_key: replay
          job_cluster_key: fixed_classic
          max_retries: 0
          libraries:
            - whl: ../dist/*.whl
          python_wheel_task:
            package_name: nyc_taxi_lakehouse
            entry_point: nyc-taxi-compute-experiment
            named_parameters:
              phase: "{{job.parameters.phase}}"
              experiment_id: "{{job.parameters.experiment_id}}"
              sample_id: "{{job.parameters.sample_id}}"
              compute_type: CLASSIC
              job_run_id: "{{job.run_id}}"

targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/nyc-taxi-lakehouse/compute-experiments
