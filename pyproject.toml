[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-lakehouse"
version = "0.1.0"
description = "Incremental NYC TLC lakehouse pipeline for Azure Databricks."
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<9", "ruff>=0.9,<1", "pyspark>=3.5.4,<3.6"]
benchmark = ["databricks-sdk>=0.60,<1", "databricks-sql-connector>=4,<5"]

[project.scripts]
nyc-taxi-pipeline = "nyc_taxi_lakehouse.cli:main"
nyc-taxi-freeze = "nyc_taxi_lakehouse.benchmark_snapshot:main"
nyc-taxi-benchmark = "nyc_taxi_lakehouse.benchmark:main"
nyc-taxi-experiment = "nyc_taxi_lakehouse.pipeline_experiment:main"
nyc-taxi-gold-experiment = "nyc_taxi_lakehouse.gold_experiment:main"
nyc-taxi-compute-experiment = "nyc_taxi_lakehouse.compute_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyc_taxi_lakehouse = ["benchmark_sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
